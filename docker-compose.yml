version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: building63-db
    environment:
      POSTGRES_DB: building63
      POSTGRES_USER: building63
      POSTGRES_PASSWORD: building63pass
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build: ./backend
    container_name: building63-backend
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/building63
      SPRING_DATASOURCE_USERNAME: building63
      SPRING_DATASOURCE_PASSWORD: building63pass
    ports:
      - "8080:8080"
    depends_on:
      - db

  frontend:
    build: ./frontend
    container_name: building63-frontend
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  postgres_data:
