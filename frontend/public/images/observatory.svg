<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#87CEEB"/>
      <stop offset="100%" stop-color="#E0F0FF"/>
    </linearGradient>
    <linearGradient id="river" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4A90D9"/>
      <stop offset="100%" stop-color="#2563EB"/>
    </linearGradient>
  </defs>
  <rect width="800" height="500" fill="url(#sky)"/>
  <!-- Mountains -->
  <polygon points="0,300 150,150 300,300" fill="#6B8FA3" opacity="0.6"/>
  <polygon points="100,300 280,120 450,300" fill="#5A7A8F" opacity="0.7"/>
  <!-- City buildings -->
  <g fill="#2a3a4a" opacity="0.7">
    <rect x="0" y="250" width="80" height="250"/><rect x="70" y="220" width="60" height="280"/>
    <rect x="120" y="200" width="70" height="300"/><rect x="180" y="230" width="50" height="270"/>
    <rect x="220" y="210" width="80" height="290"/><rect x="290" y="240" width="60" height="260"/>
    <rect x="340" y="200" width="90" height="300"/><rect x="420" y="220" width="70" height="280"/>
    <rect x="480" y="210" width="80" height="290"/><rect x="550" y="230" width="60" height="270"/>
    <rect x="600" y="200" width="70" height="300"/><rect x="660" y="220" width="80" height="280"/>
    <rect x="730" y="240" width="70" height="260"/>
  </g>
  <!-- Han River -->
  <rect x="0" y="370" width="800" height="80" fill="url(#river)" opacity="0.8"/>
  <!-- Bridge -->
  <line x1="0" y1="380" x2="800" y2="380" stroke="white" stroke-width="3" opacity="0.5"/>
  <!-- Window frame of observatory -->
  <rect x="0" y="0" width="800" height="500" fill="none" stroke="#C9A84C" stroke-width="20" opacity="0.3"/>
  <!-- Corner decorations -->
  <rect x="0" y="0" width="60" height="5" fill="#C9A84C"/>
  <rect x="0" y="0" width="5" height="60" fill="#C9A84C"/>
  <rect x="740" y="0" width="60" height="5" fill="#C9A84C"/>
  <rect x="795" y="0" width="5" height="60" fill="#C9A84C"/>
  <rect x="0" y="495" width="60" height="5" fill="#C9A84C"/>
  <rect x="0" y="440" width="5" height="60" fill="#C9A84C"/>
  <rect x="740" y="495" width="60" height="5" fill="#C9A84C"/>
  <rect x="795" y="440" width="5" height="60" fill="#C9A84C"/>
  <!-- Text overlay -->
  <text x="400" y="460" font-family="Arial" font-size="14" fill="#C9A84C" text-anchor="middle" opacity="0.8">60F · 249m · OBSERVATORY</text>
</svg>
