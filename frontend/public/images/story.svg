<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0a0e1a"/>
      <stop offset="100%" stop-color="#1a1208"/>
    </linearGradient>
    <linearGradient id="building-grad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#8B7355"/>
      <stop offset="30%" stop-color="#C9A84C"/>
      <stop offset="70%" stop-color="#F5D170"/>
      <stop offset="100%" stop-color="#C9A84C"/>
    </linearGradient>
  </defs>
  <rect width="800" height="500" fill="url(#bg)"/>
  <!-- Stars -->
  <g fill="white" opacity="0.5">
    <circle cx="50" cy="30" r="1"/><circle cx="150" cy="60" r="1.5"/><circle cx="300" cy="20" r="1"/>
    <circle cx="500" cy="40" r="1.5"/><circle cx="700" cy="25" r="1"/><circle cx="750" cy="70" r="1.5"/>
    <circle cx="650" cy="50" r="1"/><circle cx="450" cy="15" r="1.5"/><circle cx="200" cy="40" r="1"/>
  </g>
  <!-- Han River (bottom) -->
  <rect x="0" y="380" width="800" height="120" fill="#0d1f35" opacity="0.9"/>
  <!-- City background -->
  <g fill="#1a2a3a" opacity="0.6">
    <rect x="0" y="300" width="60" height="200"/><rect x="55" y="270" width="45" height="230"/>
    <rect x="680" y="280" width="50" height="220"/><rect x="725" y="260" width="75" height="240"/>
  </g>
  <!-- 63 Building - tall and golden -->
  <rect x="330" y="60" width="140" height="380" fill="#1a1208"/>
  <!-- Gold facade -->
  <rect x="333" y="60" width="134" height="380" fill="url(#building-grad)" opacity="0.6"/>
  <!-- Windows grid -->
  <g fill="#fff" opacity="0.4">
    <rect x="345" y="80" width="10" height="6"/><rect x="360" y="80" width="10" height="6"/>
    <rect x="375" y="80" width="10" height="6"/><rect x="390" y="80" width="10" height="6"/>
    <rect x="405" y="80" width="10" height="6"/><rect x="420" y="80" width="10" height="6"/>
    <rect x="435" y="80" width="10" height="6"/>
    <rect x="345" y="92" width="10" height="6"/><rect x="360" y="92" width="10" height="6"/>
    <rect x="375" y="92" width="10" height="6"/><rect x="390" y="92" width="10" height="6"/>
    <rect x="405" y="92" width="10" height="6"/><rect x="420" y="92" width="10" height="6"/>
    <rect x="435" y="92" width="10" height="6"/>
    <rect x="345" y="104" width="10" height="6"/><rect x="360" y="104" width="10" height="6"/>
    <rect x="375" y="104" width="10" height="6"/><rect x="390" y="104" width="10" height="6"/>
    <rect x="405" y="104" width="10" height="6"/><rect x="420" y="104" width="10" height="6"/>
    <rect x="435" y="104" width="10" height="6"/>
  </g>
  <!-- Gold vertical lines -->
  <g stroke="#C9A84C" stroke-width="1" opacity="0.5">
    <line x1="350" y1="60" x2="350" y2="440"/>
    <line x1="370" y1="60" x2="370" y2="440"/>
    <line x1="390" y1="60" x2="390" y2="440"/>
    <line x1="410" y1="60" x2="410" y2="440"/>
    <line x1="430" y1="60" x2="430" y2="440"/>
    <line x1="450" y1="60" x2="450" y2="440"/>
  </g>
  <!-- Building top -->
  <polygon points="400,30 330,60 470,60" fill="#C9A84C"/>
  <rect x="397" y="10" width="6" height="25" fill="#C9A84C"/>
  <!-- Reflection in river -->
  <rect x="330" y="380" width="140" height="80" fill="url(#building-grad)" opacity="0.2"/>
  <!-- "1985" text -->
  <text x="400" y="480" font-family="Arial" font-size="12" fill="#C9A84C" text-anchor="middle" opacity="0.8">SINCE 1985 · 63 BUILDING · SEOUL</text>
</svg>
