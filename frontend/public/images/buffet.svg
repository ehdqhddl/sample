<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500">
  <defs>
    <linearGradient id="tablecloth" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f9f5ee"/>
      <stop offset="100%" stop-color="#ede9e0"/>
    </linearGradient>
  </defs>
  <rect width="800" height="500" fill="#1a1a2e"/>
  <!-- Ambient lighting -->
  <ellipse cx="400" cy="200" rx="300" ry="200" fill="#C9A84C" opacity="0.05"/>
  <!-- Buffet table -->
  <rect x="50" y="280" width="700" height="20" rx="3" fill="#4a3728"/>
  <rect x="50" y="300" width="700" height="160" fill="#5a4535"/>
  <!-- Food dishes -->
  <g>
    <!-- Lobster dish -->
    <ellipse cx="130" cy="265" rx="50" ry="15" fill="#fff" opacity="0.9"/>
    <ellipse cx="130" cy="260" rx="40" ry="12" fill="#E63946"/>
    <path d="M110,255 Q130,240 150,255" stroke="#c0392b" stroke-width="3" fill="none"/>
    <text x="130" y="295" font-family="Arial" font-size="9" fill="#C9A84C" text-anchor="middle">LOBSTER</text>
  </g>
  <g>
    <!-- Sushi plate -->
    <ellipse cx="260" cy="265" rx="50" ry="15" fill="#fff" opacity="0.9"/>
    <rect x="230" y="250" width="20" height="12" rx="2" fill="#fffde7"/>
    <rect x="255" y="250" width="20" height="12" rx="2" fill="#fffde7"/>
    <rect x="280" y="250" width="20" height="12" rx="2" fill="#fffde7"/>
    <rect x="230" y="252" width="20" height="5" fill="#E63946" opacity="0.8"/>
    <rect x="255" y="252" width="20" height="5" fill="#FF8C00" opacity="0.8"/>
    <rect x="280" y="252" width="20" height="5" fill="#2A9D8F" opacity="0.8"/>
    <text x="260" y="295" font-family="Arial" font-size="9" fill="#C9A84C" text-anchor="middle">SUSHI</text>
  </g>
  <g>
    <!-- Steak -->
    <ellipse cx="400" cy="265" rx="55" ry="16" fill="#fff" opacity="0.9"/>
    <ellipse cx="400" cy="258" rx="40" ry="12" fill="#8B4513"/>
    <ellipse cx="400" cy="256" rx="30" ry="9" fill="#A0522D"/>
    <text x="400" y="295" font-family="Arial" font-size="9" fill="#C9A84C" text-anchor="middle">PREMIUM STEAK</text>
  </g>
  <g>
    <!-- Seafood tower -->
    <ellipse cx="535" cy="265" rx="50" ry="15" fill="#fff" opacity="0.9"/>
    <g fill="#457B9D">
      <circle cx="515" cy="257" r="8"/><circle cx="530" cy="252" r="7"/>
      <circle cx="548" cy="257" r="8"/><circle cx="538" cy="261" r="6"/>
    </g>
    <text x="535" y="295" font-family="Arial" font-size="9" fill="#C9A84C" text-anchor="middle">SEAFOOD</text>
  </g>
  <g>
    <!-- Dessert -->
    <ellipse cx="665" cy="265" rx="50" ry="15" fill="#fff" opacity="0.9"/>
    <circle cx="665" cy="253" r="15" fill="#F4A261"/>
    <rect x="655" y="248" width="20" height="5" fill="#fffde7" rx="2"/>
    <circle cx="665" cy="240" r="5" fill="#E63946"/>
    <text x="665" y="295" font-family="Arial" font-size="9" fill="#C9A84C" text-anchor="middle">DESSERT</text>
  </g>
  <!-- Restaurant ambiance -->
  <g opacity="0.6">
    <circle cx="200" cy="100" r="3" fill="#C9A84C"/>
    <line x1="200" y1="103" x2="200" y2="180" stroke="#C9A84C" stroke-width="1" opacity="0.4"/>
    <circle cx="400" cy="80" r="3" fill="#C9A84C"/>
    <line x1="400" y1="83" x2="400" y2="180" stroke="#C9A84C" stroke-width="1" opacity="0.4"/>
    <circle cx="600" cy="100" r="3" fill="#C9A84C"/>
    <line x1="600" y1="103" x2="600" y2="180" stroke="#C9A84C" stroke-width="1" opacity="0.4"/>
  </g>
  <text x="400" y="460" font-family="Arial" font-size="16" fill="#C9A84C" text-anchor="middle" font-weight="bold">63 SIGNATURE SEAFOOD BUFFET</text>
</svg>
