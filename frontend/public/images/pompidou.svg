<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500">
  <defs>
    <linearGradient id="wall" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f8f8f6"/>
      <stop offset="100%" stop-color="#e8e8e4"/>
    </linearGradient>
  </defs>
  <rect width="800" height="500" fill="url(#wall)"/>
  <!-- Art 1: Abstract geometric -->
  <g transform="translate(60,60)">
    <rect width="200" height="160" fill="white" stroke="#ddd"/>
    <circle cx="80" cy="80" r="50" fill="#E63946" opacity="0.8"/>
    <rect x="110" y="30" width="70" height="100" fill="#1D3557" opacity="0.8"/>
    <polygon points="60,130 120,50 180,130" fill="#F4A261" opacity="0.8"/>
    <text x="100" y="185" font-family="Arial" font-size="10" fill="#666" text-anchor="middle">Composition Study #1</text>
  </g>
  <!-- Art 2: Color field -->
  <g transform="translate(310,40)">
    <rect width="180" height="200" fill="white" stroke="#ddd"/>
    <rect x="5" y="5" width="170" height="95" fill="#2A9D8F"/>
    <rect x="5" y="100" width="170" height="95" fill="#E9C46A"/>
    <text x="90" y="220" font-family="Arial" font-size="10" fill="#666" text-anchor="middle">Horizon Series 2024</text>
  </g>
  <!-- Art 3: Portrait style -->
  <g transform="translate(540,60)">
    <rect width="200" height="160" fill="white" stroke="#ddd"/>
    <ellipse cx="100" cy="70" rx="40" ry="50" fill="#F4A261"/>
    <rect x="60" y="110" width="80" height="40" fill="#264653"/>
    <circle cx="85" cy="60" r="8" fill="#2A9D8F"/>
    <circle cx="115" cy="60" r="8" fill="#2A9D8F"/>
    <text x="100" y="185" font-family="Arial" font-size="10" fill="#666" text-anchor="middle">Urban Life Collection</text>
  </g>
  <!-- Art 4: Large landscape -->
  <g transform="translate(60,290)">
    <rect width="300" height="160" fill="white" stroke="#ddd"/>
    <rect x="5" y="5" width="290" height="90" fill="#457B9D"/>
    <rect x="5" y="95" width="290" height="60" fill="#1D3557"/>
    <circle cx="250" cy="40" r="25" fill="#F4A261" opacity="0.9"/>
    <text x="150" y="185" font-family="Arial" font-size="10" fill="#666" text-anchor="middle">Nightscape · Pompidou Collection</text>
  </g>
  <!-- Art 5: Abstract sculpture -->
  <g transform="translate(420,290)">
    <rect width="320" height="160" fill="white" stroke="#ddd"/>
    <polygon points="100,140 160,20 220,140" fill="#E63946" opacity="0.7"/>
    <circle cx="250" cy="80" r="50" fill="#2A9D8F" opacity="0.7"/>
    <rect x="30" y="60" width="60" height="80" fill="#E9C46A" opacity="0.7"/>
    <text x="160" y="185" font-family="Arial" font-size="10" fill="#666" text-anchor="middle">Modern Sculpture Exhibition</text>
  </g>
  <!-- Museum label -->
  <rect x="240" y="460" width="320" height="30" rx="15" fill="#1D3557"/>
  <text x="400" y="480" font-family="Arial" font-size="13" fill="white" text-anchor="middle" font-weight="bold">CENTRE POMPIDOU × 63 BUILDING</text>
</svg>
