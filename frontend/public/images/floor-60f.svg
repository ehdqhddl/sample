<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <rect width="800" height="600" fill="#f2ebe0"/>
  <!-- Outer ring - circular observatory -->
  <circle cx="400" cy="300" r="260" fill="none" stroke="#1a2e17" stroke-width="2.5"/>
  <circle cx="400" cy="300" r="240" fill="#dce8d6" stroke="#6a8b5d" stroke-width="1"/>
  <!-- Inner walkway ring -->
  <circle cx="400" cy="300" r="160" fill="#f0f5ee" stroke="#c8bfae" stroke-width="1.5"/>
  <!-- Core (elevator, stairs) -->
  <circle cx="400" cy="300" r="80" fill="#c8bfae" stroke="#9a8a6d" stroke-width="1.5"/>
  <text x="400" y="294" text-anchor="middle" font-family="Georgia,serif" font-size="11" fill="#3d5c35">엘리베이터</text>
  <text x="400" y="311" text-anchor="middle" font-family="Georgia,serif" font-size="11" fill="#3d5c35">코어</text>

  <!-- Observatory deck labels around ring -->
  <text x="400" y="95" text-anchor="middle" font-family="Georgia,serif" font-size="13" fill="#1a2e17" font-weight="300">북 · 한강 뷰</text>
  <text x="400" y="110" text-anchor="middle" font-family="Georgia,serif" font-size="9" fill="#4e6b42">North · Han River View</text>

  <text x="650" y="305" text-anchor="middle" font-family="Georgia,serif" font-size="13" fill="#1a2e17" font-weight="300">동 · 도심 뷰</text>
  <text x="650" y="320" text-anchor="middle" font-family="Georgia,serif" font-size="9" fill="#4e6b42">East · City View</text>

  <text x="400" y="505" text-anchor="middle" font-family="Georgia,serif" font-size="13" fill="#1a2e17" font-weight="300">남 · 서울 파노라마</text>
  <text x="400" y="520" text-anchor="middle" font-family="Georgia,serif" font-size="9" fill="#4e6b42">South · Seoul Panorama</text>

  <text x="148" y="305" text-anchor="middle" font-family="Georgia,serif" font-size="13" fill="#1a2e17" font-weight="300">서 · 인천 뷰</text>
  <text x="148" y="320" text-anchor="middle" font-family="Georgia,serif" font-size="9" fill="#4e6b42">West · Incheon View</text>

  <!-- Compass -->
  <text x="400" y="175" text-anchor="middle" font-size="14" fill="#4e6b42">N</text>
  <line x1="400" y1="180" x2="400" y2="200" stroke="#4e6b42" stroke-width="1.5"/>

  <!-- Viewing platform sections -->
  <text x="400" y="232" text-anchor="middle" font-family="Georgia,serif" font-size="11" fill="#5a5238">전망 데크 (야외)</text>
  <text x="400" y="370" text-anchor="middle" font-family="Georgia,serif" font-size="11" fill="#5a5238">실내 전망대</text>

  <!-- Gift shop area -->
  <rect x="310" y="420" width="180" height="60" fill="#ddd1be" stroke="#b8a78b" stroke-width="1" rx="3"/>
  <text x="400" y="453" text-anchor="middle" font-family="Georgia,serif" font-size="10" fill="#5a5238">기념품 샵 · Gift Shop</text>

  <!-- Title -->
  <rect x="60" y="20" width="120" height="28" fill="#1a2e17"/>
  <text x="120" y="39" text-anchor="middle" font-family="Georgia,serif" font-size="13" fill="#f2ebe0" font-weight="300">60F 전망대</text>

  <!-- Altitude indicator -->
  <text x="700" y="30" text-anchor="end" font-family="Georgia,serif" font-size="11" fill="#7a6e52">249m · Seoul</text>
  <text x="700" y="48" text-anchor="end" font-family="Georgia,serif" font-size="9" fill="#9a8a6d">360° Panorama View</text>

  <!-- Ticket info -->
  <text x="400" y="568" text-anchor="middle" font-family="Georgia,serif" font-size="10" fill="#7a6e52">운영시간: 10:00 – 22:00 · 입장 마감 21:30</text>
</svg>
