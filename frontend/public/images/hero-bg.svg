<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 800" width="1440" height="800">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0a1628"/>
      <stop offset="60%" stop-color="#1a2a4a"/>
      <stop offset="100%" stop-color="#2d1a0e"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#C9A84C"/>
      <stop offset="50%" stop-color="#F5D170"/>
      <stop offset="100%" stop-color="#C9A84C"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="40%" r="40%">
      <stop offset="0%" stop-color="#C9A84C" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#C9A84C" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <!-- Sky background -->
  <rect width="1440" height="800" fill="url(#sky)"/>
  <!-- Glow -->
  <ellipse cx="720" cy="400" rx="500" ry="400" fill="url(#glow)"/>
  <!-- Stars -->
  <g fill="white" opacity="0.6">
    <circle cx="100" cy="80" r="1.5"/><circle cx="250" cy="120" r="1"/><circle cx="400" cy="60" r="1.5"/>
    <circle cx="600" cy="100" r="1"/><circle cx="800" cy="50" r="2"/><circle cx="1000" cy="90" r="1.5"/>
    <circle cx="1200" cy="70" r="1"/><circle cx="1350" cy="110" r="1.5"/><circle cx="180" cy="200" r="1"/>
    <circle cx="500" cy="180" r="1.5"/><circle cx="900" cy="150" r="1"/><circle cx="1100" cy="200" r="1.5"/>
  </g>
  <!-- City skyline (background) -->
  <g opacity="0.3" fill="#1a2a4a">
    <rect x="0" y="550" width="60" height="250"/><rect x="50" y="520" width="40" height="280"/>
    <rect x="80" y="500" width="50" height="300"/><rect x="120" y="540" width="30" height="260"/>
    <rect x="1200" y="520" width="60" height="280"/><rect x="1260" y="540" width="40" height="260"/>
    <rect x="1300" y="500" width="50" height="300"/><rect x="1350" y="530" width="90" height="270"/>
  </g>
  <!-- 63 Building silhouette -->
  <g>
    <!-- Building base -->
    <rect x="640" y="180" width="160" height="600" fill="#1a1a2e" opacity="0.9"/>
    <!-- Gold glass panels -->
    <g opacity="0.8">
      <rect x="645" y="185" width="150" height="590" fill="url(#gold)" opacity="0.15"/>
    </g>
    <!-- Windows pattern -->
    <g fill="#C9A84C" opacity="0.4">
      <rect x="655" y="200" width="12" height="8"/><rect x="675" y="200" width="12" height="8"/>
      <rect x="695" y="200" width="12" height="8"/><rect x="715" y="200" width="12" height="8"/>
      <rect x="735" y="200" width="12" height="8"/><rect x="755" y="200" width="12" height="8"/>
      <rect x="775" y="200" width="12" height="8"/>
      <rect x="655" y="215" width="12" height="8"/><rect x="675" y="215" width="12" height="8"/>
      <rect x="695" y="215" width="12" height="8"/><rect x="715" y="215" width="12" height="8"/>
      <rect x="735" y="215" width="12" height="8"/><rect x="755" y="215" width="12" height="8"/>
      <rect x="775" y="215" width="12" height="8"/>
      <rect x="655" y="230" width="12" height="8"/><rect x="675" y="230" width="12" height="8"/>
      <rect x="695" y="230" width="12" height="8"/><rect x="715" y="230" width="12" height="8"/>
      <rect x="735" y="230" width="12" height="8"/><rect x="755" y="230" width="12" height="8"/>
      <rect x="775" y="230" width="12" height="8"/>
    </g>
    <!-- Gold vertical lines -->
    <line x1="660" y1="185" x2="660" y2="775" stroke="#C9A84C" stroke-width="1" opacity="0.5"/>
    <line x1="695" y1="185" x2="695" y2="775" stroke="#C9A84C" stroke-width="1" opacity="0.5"/>
    <line x1="730" y1="185" x2="730" y2="775" stroke="#C9A84C" stroke-width="1" opacity="0.5"/>
    <line x1="765" y1="185" x2="765" y2="775" stroke="#C9A84C" stroke-width="1" opacity="0.5"/>
    <!-- Top -->
    <polygon points="720,150 660,185 780,185" fill="#C9A84C" opacity="0.9"/>
    <line x1="720" y1="130" x2="720" y2="155" stroke="#C9A84C" stroke-width="3"/>
  </g>
  <!-- Han River reflection -->
  <rect x="0" y="650" width="1440" height="150" fill="#0a1628" opacity="0.7"/>
  <g opacity="0.2">
    <ellipse cx="720" cy="700" rx="80" ry="20" fill="url(#gold)"/>
  </g>
</svg>
